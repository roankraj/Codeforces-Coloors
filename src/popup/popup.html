<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Theme</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <span class="field-label">Theme</span>

    <div class="dd" id="dd">
      <button type="button" class="dd-btn" id="dd-btn">
        <span class="swatches" id="dd-swatches"></span>
        <span class="dd-text" id="dd-text">Select…</span>
        <svg
          class="dd-chevron"
          viewBox="0 0 12 12"
          fill="none"
          stroke="currentColor"
          stroke-width="1.6"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <path d="M2 4.25 6 8l4-3.75" />
        </svg>
      </button>

      <ul class="dd-list" id="dd-list" hidden>
        <button
          class="dd-opt"
          data-value="dark"
          data-colors="#111111,#444444,#5183f0"
        >
          Dark
        </button>
        <button
          class="dd-opt"
          data-value="love"
          data-colors="#fffffc,#f4bbd3,#ff758f"
        >
          Pink
        </button>
        <button
          class="dd-opt"
          data-value="blue"
          data-colors="#101522,#202b40,#8ab4ff"
        >
          Blue
        </button>
        <button
          class="dd-opt"
          data-value="black"
          data-colors="#000000,#eeeeee,#5183f0"
        >
          Black
        </button>
        <button
          class="dd-opt"
          data-value="light"
          data-colors="#ffffff,#e1e1e1,#3b5998"
        >
          Light
        </button>
        <button
          class="dd-opt"
          data-value="device"
          data-colors="#111111,#888888,#ffffff"
        >
          Device
        </button>
      </ul>
    </div>

    <fieldset class="utils">
      <legend>Utilities</legend>
      <label class="util">
        <input type="checkbox" data-util="focus-mode" />
        <span>Focus Mode</span>
        <div class="shortcut">Ctrl + Shift + F</div>
      </label>
    </fieldset>

    <script src="popup.js"></script>
  </body>
</html>
